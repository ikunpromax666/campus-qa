server:
  port: 8848
spring:
  application:
    name: campus-qa-web
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_qa?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf-8
    username: root
    password: syf1017539550
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# JWT 配置
jwt:
  # HS256 密钥，长度必须 >= 32 字符（256位）；生产环境应改用环境变量/配置中心，不要提交真实密钥
  secret: campus-qa-dev-jwt-secret-2026-abc123456789
  # token 有效期（小时），72 = 3 天
  expire-hours: 72

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 开发环境打印 SQL（生产环境关闭）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 驼峰映射（数据库 create_time → Java createTime）
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键策略：自增（与实体 @TableId(AUTO) 一致，这里做全局兜底）
      id-type: auto

# 日志编码：强制 Logback 控制台输出 UTF-8，解决 Windows + IDEA 中文乱码
logging:
  charset:
    console: UTF-8
