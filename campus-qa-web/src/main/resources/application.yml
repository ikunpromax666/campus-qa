server:
  port: 8848
spring:
  application:
    name: campus-qa-web
  # 文件上传限制（头像上传）；超限由 GlobalExceptionHandler 的 MaxUploadSizeExceededException 转成友好提示
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 5MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_qa?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf-8
    username: root
    password: syf1017539550
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# JWT 配置
jwt:
  # HS256 密钥，长度必须 >= 32 字符（256位）；生产环境应改用环境变量/配置中心，不要提交真实密钥
  secret: campus-qa-dev-jwt-secret-2026-abc123456789
  # token 有效期（小时），72 = 3 天
  expire-hours: 72

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 开发环境打印 SQL（生产环境关闭）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 驼峰映射（数据库 create_time → Java createTime）
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键策略：自增（与实体 @TableId(AUTO) 一致，这里做全局兜底）
      id-type: auto

# 日志编码：强制 Logback 控制台输出 UTF-8，解决 Windows + IDEA 中文乱码
logging:
  charset:
    console: UTF-8
  file:
    # 日志落盘：便于排查线上问题（启动后自动创建 logs/campus-qa.log）
    name: logs/campus-qa.log

# 阿里云 OSS（头像上传用）
# Bucket 需要设置"公共读"权限，否则上传成功后返回的 URL 无法在浏览器直接打开
# AK/SK 从环境变量注入（ALIYUN_OSS_ACCESS_KEY_ID / ALIYUN_OSS_ACCESS_KEY_SECRET）：
#   - IDEA：Run Configuration → Environment variables 里配
#   - 或 Windows 用户级环境变量（setx，需重启 IDEA 生效）
# 面试考点：AK/SK 属于敏感凭据，绝不能硬编码提交到 Git；生产用配置中心/K8s Secret 注入
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: campus-a
